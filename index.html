<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sentier — suivi de marche</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg:#101a16;
    --surface:#17241f;
    --surface-2:#1e2e27;
    --line:#2b3d34;
    --text:#ece8d9;
    --text-muted:#8fa096;
    --accent:#7fbf6b;
    --accent-2:#e8a33d;
    --danger:#c1544a;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    overflow:hidden;
  }
  #app{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(127,191,107,0.07), transparent 60%),
      repeating-linear-gradient( to bottom, transparent 0 46px, var(--line) 46px 47px ),
      var(--bg);
  }
  header{
    padding: calc(14px + var(--safe-top)) 20px 12px;
    display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0;
  }
  header h1{
    margin:0; font-size:17px; font-weight:600; letter-spacing:0.02em;
  }
  header h1 .dot{ color:var(--accent); }
  .header-right{ display:flex; align-items:center; gap:12px; }
  header .sub{ font-size:12px; color:var(--text-muted); }
  .icon-btn{
    background:none; border:none; padding:0; flex:none; width:auto;
    font-size:16px; color:var(--text-muted); line-height:1;
  }

  .view{ flex:1; min-height:0; display:none; flex-direction:column; }
  .view.active{ display:flex; }

  /* --- TRACKER VIEW --- */
  #map{ flex:1; min-height:0; background:var(--surface); }
  .leaflet-container{ background:var(--surface) !important; font-family:'Space Grotesk',sans-serif; }

  #trackerPanel{
    flex-shrink:0;
    background:var(--surface);
    border-top:1px solid var(--line);
    padding:18px 20px calc(14px + var(--safe-bottom));
  }
  .stat-row{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    margin-bottom:16px;
  }
  .stat{
    background:var(--surface-2);
    border-radius:10px;
    padding:10px 12px;
    border:1px solid var(--line);
  }
  .stat .label{ font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); }
  .stat .value{
    font-family:'IBM Plex Mono',monospace; font-weight:600;
    font-size:20px; font-variant-numeric:tabular-nums;
    margin-top:2px;
  }
  .stat.accent .value{ color:var(--accent-2); }

  .controls{ display:flex; gap:10px; }
  button{
    font-family:'Space Grotesk',sans-serif;
    border:none; border-radius:12px;
    font-size:15px; font-weight:600;
    padding:15px 0; flex:1;
    cursor:pointer;
    transition:transform .08s ease, opacity .15s ease;
  }
  button:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--accent); color:#0e1a13; }
  .status-badge{
    display:flex; align-items:center; gap:7px;
    font-size:12px; color:var(--text-muted);
    margin-bottom:14px;
  }
  .status-badge .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .status-badge.tracking .dot{ background:var(--accent); animation:pulse 1.4s ease-in-out infinite; }
  .status-badge.paused .dot{ background:var(--accent-2); }
  .status-badge.paused{ color:var(--accent-2); }
  .btn-finish{ background:var(--accent-2); color:#241705; }
  .btn-danger{ background:transparent; color:var(--danger); border:1px solid var(--danger); }

  .btn-finish-hold{
    position:relative; overflow:hidden;
    flex:0 0 108px; padding:10px 4px;
    background:var(--surface-2); color:var(--accent-2);
    border:1.5px solid var(--accent-2);
    font-size:11.5px; line-height:1.25;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    touch-action:manipulation;
  }
  .hold-fill{
    position:absolute; left:0; top:0; bottom:0; width:0%;
    background:var(--accent-2); opacity:0.4; z-index:0; pointer-events:none;
  }
  .hold-label{ position:relative; z-index:1; display:block; }

  .rec-pulse{
    width:8px; height:8px; border-radius:50%; background:var(--accent-2);
    display:inline-block; margin-right:6px;
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }

  .permission-note{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:12px; text-align:center; padding:0 30px;
    background:var(--surface); color:var(--text-muted); font-size:14px;
    z-index:500;
  }
  .permission-note button{ padding:12px 22px; flex:none; }

  /* --- HISTORY VIEW --- */
  #historyList{ flex:1; overflow-y:auto; padding:4px 16px 20px; }
  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; color:var(--text-muted); text-align:center; padding:0 30px; gap:6px;
  }
  .empty-state svg{ opacity:0.5; margin-bottom:6px; }

  #statsPanel{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin:8px 0 14px;
  }
  .week-summary{ display:flex; }
  .ws-item{ flex:1; text-align:center; }
  .ws-val{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:18px; }
  .ws-label{ font-size:10px; color:var(--text-muted); margin-top:2px; }
  .week-chart{
    display:flex; justify-content:space-between; align-items:flex-end;
    height:70px; margin-top:16px; padding-top:6px; border-top:1px solid var(--line);
  }
  .wbar-col{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; }
  .wbar{ width:14px; border-radius:3px 3px 0 0; }
  .wbar-label{ font-size:9px; color:var(--text-muted); }

  .activity-card{
    display:flex; gap:12px; align-items:center;
    background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:12px; margin-bottom:10px;
    cursor:pointer;
  }
  .activity-card canvas{ border-radius:8px; background:var(--surface-2); flex-shrink:0; }
  .activity-info{ flex:1; min-width:0; }
  .activity-date{ font-size:11px; color:var(--text-muted); text-transform:capitalize; }
  .activity-stats{ display:flex; gap:14px; margin-top:4px; }
  .activity-stats .n{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; }
  .activity-stats .u{ font-size:10px; color:var(--text-muted); display:block; }
  .activity-del{
    background:none; border:none; color:var(--text-muted); flex:none;
    width:30px; height:30px; padding:0; border-radius:8px; font-size:16px;
  }
  .activity-del:active{ background:var(--surface-2); }

  /* --- BOTTOM NAV --- */
  nav{
    flex-shrink:0;
    display:flex;
    border-top:1px solid var(--line);
    background:var(--surface);
    padding-bottom: var(--safe-bottom);
  }
  nav button{
    flex:1; background:none; border-radius:0; padding:12px 0 10px;
    color:var(--text-muted); font-size:12px; font-weight:600;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  nav button.active{ color:var(--accent); }
  nav button svg{ width:20px; height:20px; }

  /* --- DETAIL OVERLAY --- */
  #detailOverlay{
    position:fixed; inset:0; background:var(--bg); z-index:1000;
    display:none; flex-direction:column;
  }
  #detailOverlay.active{ display:flex; }
  #detailMap{ flex:1; }
  #detailPanel{
    background:var(--surface); border-top:1px solid var(--line);
    padding:16px 20px calc(14px + var(--safe-bottom));
    overflow-y:auto; max-height:52vh;
  }
  .detail-header{
    display:flex; justify-content:space-between; align-items:center;
    padding: calc(10px + var(--safe-top)) 16px 8px;
    flex-shrink:0;
  }
  .detail-header h2{ font-size:15px; margin:0; font-weight:600; text-transform:capitalize; }
  .close-btn{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    width:34px; height:34px; border-radius:10px; flex:none; padding:0; font-size:16px;
  }
  .splits-list{ margin-top:4px; max-height:140px; overflow-y:auto; }
  .split-row{
    display:flex; justify-content:space-between; padding:7px 4px;
    border-bottom:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace; font-size:13px;
  }
  .split-row:last-child{ border-bottom:none; }

  /* --- REPLAY OVERLAY (vue inclinée CSS + profil altimétrique) --- */
  #replayOverlay{
    position:fixed; inset:0; background:var(--bg); z-index:1100;
    display:none; flex-direction:column;
  }
  #replayOverlay.active{ display:flex; }
  #replayViewport{
    flex:1; position:relative; overflow:hidden;
    perspective:900px; background:#0c1512;
  }
  #replayMap{
    position:absolute; inset:-22% -16%;
    transform: rotateX(50deg) scale(1.55);
    transform-origin:50% 88%;
  }
  #elevProfile{
    height:64px; flex-shrink:0; background:var(--surface);
    border-top:1px solid var(--line); padding:4px 12px;
    display:flex; align-items:center;
  }
  #elevCanvas{ width:100%; height:100%; display:block; }
  .elev-empty{ color:var(--text-muted); font-size:11px; }
  #replayControls{
    display:flex; align-items:center; gap:12px; flex-shrink:0;
    background:var(--surface); border-top:1px solid var(--line);
    padding:12px 16px calc(12px + var(--safe-bottom));
  }
  #replayReadout{
    flex:1; font-family:'IBM Plex Mono',monospace; font-size:14px; font-variant-numeric:tabular-nums;
  }
  .speed-group{ display:flex; gap:6px; }
  .speed-btn{
    flex:none; padding:8px 10px; font-size:12px;
    background:var(--surface-2); border:1px solid var(--line); color:var(--text-muted);
    border-radius:8px;
  }
  .speed-btn.active{ color:var(--bg); background:var(--accent); border-color:var(--accent); }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>Sentier<span class="dot">.</span></h1>
    <div class="header-right">
      <span class="sub" id="headerSub">marche à pied</span>
      <button class="icon-btn" id="soundToggleBtn" title="Alertes au kilomètre" onclick="toggleSound()">🔔</button>
    </div>
  </header>

  <!-- TRACKER VIEW -->
  <div class="view active" id="view-tracker">
    <div style="position:relative; flex:1; min-height:0; display:flex; flex-direction:column;">
      <div id="map"></div>
      <div class="permission-note" id="permissionNote" style="display:none;">
        <div id="permissionText">Autorise la localisation pour suivre ton parcours.</div>
        <button class="btn-primary" onclick="requestLocation()">Activer le GPS</button>
      </div>
    </div>
    <div id="trackerPanel">
      <div class="status-badge tracking" id="statusBadge" style="display:none;">
        <span class="dot"></span>
        <span id="statusText">Enregistrement en cours</span>
      </div>
      <div class="stat-row">
        <div class="stat">
          <div class="label">Durée</div>
          <div class="value" id="statTime">00:00</div>
        </div>
        <div class="stat accent">
          <div class="label">Distance</div>
          <div class="value" id="statDist">0.00 km</div>
        </div>
        <div class="stat">
          <div class="label">Vitesse</div>
          <div class="value" id="statSpeed">— km/h</div>
        </div>
        <div class="stat">
          <div class="label">Dénivelé+</div>
          <div class="value" id="statElev">0 m</div>
        </div>
      </div>
      <div class="controls" id="controlsIdle">
        <button class="btn-primary" onclick="startTracking()">Démarrer la marche</button>
      </div>
      <div class="controls" id="controlsTracking" style="display:none; justify-content:center;">
        <button class="btn-finish-hold" id="finishBtn">
          <div class="hold-fill" id="holdFill"></div>
          <span class="hold-label" id="holdLabel">Maintenir 3s<br>pour arrêter</span>
        </button>
      </div>
    </div>
  </div>

  <!-- HISTORY VIEW -->
  <div class="view" id="view-history">
    <div id="historyList"></div>
  </div>

  <nav>
    <button class="active" id="navTracker" onclick="switchView('tracker')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 20l-5-2V6l5 2m0 12l6-2m-6 2V8m6 10l5-2V4l-5 2m0 12V6m0 0L9 8"/></svg>
      Suivi
    </button>
    <button id="navHistory" onclick="switchView('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M7 14l4-4 3 3 5-6"/></svg>
      Historique
    </button>
  </nav>
</div>

<!-- DETAIL OVERLAY -->
<div id="detailOverlay">
  <div class="detail-header">
    <h2 id="detailTitle">Parcours</h2>
    <div style="display:flex; gap:8px;">
      <button class="close-btn" id="detailExportBtn" title="Exporter en GPX">⇩</button>
      <button class="close-btn" onclick="closeDetail()">✕</button>
    </div>
  </div>
  <div id="detailMap"></div>
  <div id="detailPanel">
    <div class="stat-row" id="detailStats"></div>
    <div class="splits-list" id="detailSplits"></div>
    <button class="btn-primary" style="width:100%; margin-top:12px;" id="detailReplayBtn">Revoir le parcours</button>
  </div>
</div>

<!-- REPLAY OVERLAY -->
<div id="replayOverlay">
  <div class="detail-header">
    <h2>Revoir le parcours</h2>
    <button class="close-btn" onclick="closeReplay()">✕</button>
  </div>
  <div id="replayViewport"><div id="replayMap"></div></div>
  <div id="elevProfile"><canvas id="elevCanvas"></canvas></div>
  <div id="replayControls">
    <button id="replayPlayBtn" class="btn-primary" style="flex:0 0 56px; padding:12px 0;">▶</button>
    <div id="replayReadout">0.00 km · 00:00</div>
    <div class="speed-group">
      <button class="speed-btn active" data-speed="1">1×</button>
      <button class="speed-btn" data-speed="3">3×</button>
      <button class="speed-btn" data-speed="8">8×</button>
    </div>
  </div>
</div>

<script>
/* ================= state ================= */
let map, pathLine, currentMarker, watchId = null;
let status = 'idle'; // idle | tracking | paused
let points = [];      // recorded (smoothed) points: {lat,lng,t,alt,altAcc}
let distanceM = 0;
let elevGainM = 0;
let lastGoodAlt = null;
let lastRawPoint = null;
let lastSmoothed = null;
let lastMoveAt = null;
const NO_MOVE_PAUSE_MS = 10000; // immobilité continue avant mise en pause auto
const MOVE_THRESHOLD_M = 4;     // déplacement mini pour compter comme "mouvement" (marge sur le bruit GPS à l'arrêt)
let lastAnnouncedKm = 0;
let soundEnabled = true;
let audioCtx = null;

let startTime = null, pausedAt = null, pausedTotal = 0;
let timerInterval = null;
let detailMap = null;

let replayMap = null;
let replayCoords = [];
let replayIdx = 0;
let replayPlaying = false;
let replayTimer = null;
let replaySpeed = 1;

let holdTimer = null;
let holdInterval = null;
let holdStartAt = 0;
const HOLD_DURATION_MS = 3000;

/* ================= stockage autonome (IndexedDB) =================
   window.storage est fourni par l'environnement Claude (Artifacts).
   Si l'app est hébergée en dehors de Claude (GitHub Pages, etc.),
   cette API n'existe pas : on la remplace ici par un équivalent
   IndexedDB, avec la même signature (get/set/delete(key, shared)),
   pour que le reste du code n'ait rien à changer. */
if (!window.storage){
  const DB_NAME = 'sentier-marche';
  const STORE_NAME = 'kv';
  let dbPromise = null;
  function openDB(){
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(STORE_NAME); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }
  window.storage = {
    async get(key){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get(key);
        req.onsuccess = () => resolve(req.result !== undefined ? { key, value: req.result } : null);
        req.onerror = () => reject(req.error);
      });
    },
    async set(key, value){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(value, key);
        tx.oncomplete = () => resolve({ key, value });
        tx.onerror = () => reject(tx.error);
      });
    },
    async delete(key){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(key);
        tx.oncomplete = () => resolve({ key, deleted:true });
        tx.onerror = () => reject(tx.error);
      });
    }
  };
}

/* ================= settings ================= */
async function loadSettings(){
  try{
    const r = await window.storage.get('walk-settings', false);
    if (r){ const s = JSON.parse(r.value); soundEnabled = s.soundEnabled !== false; }
  }catch(e){ /* keep default true */ }
  updateSoundBtn();
}
async function saveSettings(){
  try{ await window.storage.set('walk-settings', JSON.stringify({ soundEnabled }), false); }
  catch(e){ console.error('settings save failed', e); }
}
function toggleSound(){
  soundEnabled = !soundEnabled;
  updateSoundBtn();
  saveSettings();
}
function updateSoundBtn(){
  const b = document.getElementById('soundToggleBtn');
  if (b) b.textContent = soundEnabled ? '🔔' : '🔕';
}

/* ================= storage: activities ================= */
async function getIndex(){
  try{
    const r = await window.storage.get('walk-index', false);
    return r ? JSON.parse(r.value) : [];
  }catch(e){ return []; }
}
async function saveIndex(ids){
  try{ await window.storage.set('walk-index', JSON.stringify(ids), false); }
  catch(e){ console.error('index save failed', e); }
}
async function saveActivityRecord(activity){
  try{
    await window.storage.set('walk-act:' + activity.id, JSON.stringify(activity), false);
    const ids = await getIndex();
    ids.unshift(activity.id);
    await saveIndex(ids);
    return true;
  }catch(e){ console.error('save failed', e); return false; }
}
async function getActivity(id){
  try{
    const r = await window.storage.get('walk-act:' + id, false);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function deleteActivityRecord(id){
  try{
    await window.storage.delete('walk-act:' + id, false);
    const ids = (await getIndex()).filter(x => x !== id);
    await saveIndex(ids);
  }catch(e){ console.error('delete failed', e); }
}

/* ================= geo / format helpers ================= */
function haversine(a, b){
  const R = 6371000, toRad = d => d * Math.PI/180;
  const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  const pad = n => String(n).padStart(2,'0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function fmtSpeed(sec, km){
  if (sec < 3 || km < 0.02) return '—';
  const kmh = km / (sec / 3600);
  return kmh.toFixed(1) + ' km/h';
}
function fmtSplitSpeed(sec){
  if (sec <= 0) return '—';
  return (3600 / sec).toFixed(1) + ' km/h';
}
function fmtDate(iso){
  return new Date(iso).toLocaleDateString('fr-FR', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}
/* ================= audio / vibration ================= */
function ensureAudio(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(){
  if (!soundEnabled || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = 880;
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.3);
}
function checkKmSound(){
  const kmDone = Math.floor(distanceM / 1000);
  if (kmDone > lastAnnouncedKm && kmDone > 0){
    lastAnnouncedKm = kmDone;
    if (navigator.vibrate) navigator.vibrate([180,80,180]);
    beep();
  }
}
function confirmStopSound(){
  /* Son de confirmation d'arrêt — volontairement indépendant du réglage
     soundEnabled (alertes km) : c'est un retour de sécurité, pas une option. */
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.setValueAtTime(520, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.45);
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.5);
  if (navigator.vibrate) navigator.vibrate([250]);
}

/* ================= offline tile cache (best-effort via window.storage) ================= */
const CachedTileLayer = L.TileLayer.extend({
  createTile: function(coords, done){
    const tile = document.createElement('img');
    tile.setAttribute('role', 'presentation');
    const url = this.getTileUrl(coords);
    const key = 'tile_' + url.replace(/[^a-zA-Z0-9]/g, '_');
    window.storage.get(key, false).then(res => {
      if (res && res.value){
        tile.src = res.value;
        done(null, tile);
      } else {
        fetchTile(url, key, tile, done);
      }
    }).catch(() => fetchTile(url, key, tile, done));
    return tile;
  }
});
function fetchTile(url, key, tile, done){
  try{
    fetch(url).then(r => {
      if (!r.ok) throw new Error('tile fetch failed');
      return r.blob();
    }).then(blob => {
      const reader = new FileReader();
      reader.onload = () => {
        tile.src = reader.result;
        done(null, tile);
        if (blob.size < 60000){
          window.storage.set(key, reader.result, false).catch(() => {});
        }
      };
      reader.onerror = () => done(new Error('read failed'), tile);
      reader.readAsDataURL(blob);
    }).catch(err => done(err, tile));
  }catch(err){
    done(err, tile);
  }
}

/* ================= map init ================= */
function initMap(){
  map = L.map('map', { zoomControl:false, attributionControl:false }).setView([45.75, 4.88], 15);
  new CachedTileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, subdomains:'abc' }).addTo(map);
  pathLine = L.polyline([], { color: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(), weight:4, opacity:0.9 }).addTo(map);
}

function requestLocation(){
  document.getElementById('permissionNote').style.display = 'none';
  navigator.geolocation.getCurrentPosition(
    pos => {
      map.setView([pos.coords.latitude, pos.coords.longitude], 16);
      map.invalidateSize();
    },
    err => showPermissionError(err),
    { enableHighAccuracy:true, timeout:8000 }
  );
}
function showPermissionError(err){
  const note = document.getElementById('permissionNote');
  const txt = document.getElementById('permissionText');
  txt.textContent = err && err.code === 1
    ? "Localisation refusée. Autorise-la dans les réglages du navigateur pour suivre ta marche."
    : "Localisation indisponible pour le moment.";
  note.style.display = 'flex';
}

/* ================= tracking core ================= */
function smoothPoint(raw){
  if (!lastSmoothed){ lastSmoothed = raw; return raw; }
  const alpha = 0.4;
  const sm = {
    lat: lastSmoothed.lat + alpha * (raw.lat - lastSmoothed.lat),
    lng: lastSmoothed.lng + alpha * (raw.lng - lastSmoothed.lng),
    t: raw.t, alt: raw.alt, altAcc: raw.altAcc
  };
  lastSmoothed = sm;
  return sm;
}
function updateElevation(p){
  if (typeof p.alt !== 'number' || isNaN(p.alt)) return;
  if (p.altAcc && p.altAcc > 25) return;
  if (lastGoodAlt !== null){
    const delta = p.alt - lastGoodAlt;
    if (delta > 1) elevGainM += delta;
  }
  lastGoodAlt = p.alt;
}
function registerMovement(rawP){
  if (status === 'idle') return;
  if (!lastRawPoint){ lastMoveAt = rawP.t; return; }
  const d = haversine(lastRawPoint, rawP);
  if (d >= MOVE_THRESHOLD_M){
    lastMoveAt = rawP.t;
    if (status === 'paused') exitPause();
  }
}
function checkStillness(){
  if (status !== 'tracking' || lastMoveAt === null) return;
  if (Date.now() - lastMoveAt >= NO_MOVE_PAUSE_MS) enterPause();
}

function onPosition(pos){
  const rawP = {
    lat: pos.coords.latitude, lng: pos.coords.longitude, t: Date.now(),
    acc: pos.coords.accuracy,
    alt: (typeof pos.coords.altitude === 'number') ? pos.coords.altitude : null,
    altAcc: pos.coords.altitudeAccuracy
  };
  if (rawP.acc && rawP.acc > 30) return;

  registerMovement(rawP);
  lastRawPoint = rawP;

  if (!currentMarker){
    currentMarker = L.circleMarker([rawP.lat, rawP.lng], { radius:7, color:'#101a16', weight:2, fillColor:'#e8a33d', fillOpacity:1 }).addTo(map);
  } else {
    currentMarker.setLatLng([rawP.lat, rawP.lng]);
  }
  map.panTo([rawP.lat, rawP.lng]);

  if (status !== 'tracking') return;

  const p = smoothPoint(rawP);

  if (points.length > 0){
    const last = points[points.length - 1];
    const d = haversine(last, p);
    if (d < 2) return;
    distanceM += d;
    updateElevation(p);
    checkKmSound();
  } else {
    updateElevation(p);
  }
  points.push(p);
  pathLine.setLatLngs(points.map(pt => [pt.lat, pt.lng]));
  renderStats();
}

function renderStats(){
  const elapsed = status === 'idle' ? 0 : ((pausedAt || Date.now()) - startTime - pausedTotal) / 1000;
  document.getElementById('statTime').textContent = fmtTime(elapsed);
  document.getElementById('statDist').textContent = (distanceM/1000).toFixed(2) + ' km';
  document.getElementById('statSpeed').textContent = fmtSpeed(elapsed, distanceM/1000);
  document.getElementById('statElev').textContent = Math.round(elevGainM) + ' m';
}

function startTracking(){
  document.getElementById('permissionNote').style.display = 'none';
  points = []; distanceM = 0; pausedTotal = 0; pausedAt = null;
  elevGainM = 0; lastGoodAlt = null;
  lastRawPoint = null; lastSmoothed = null;
  lastMoveAt = Date.now();
  lastAnnouncedKm = 0;
  pathLine.setLatLngs([]);
  if (currentMarker){ map.removeLayer(currentMarker); currentMarker = null; }
  startTime = Date.now();
  status = 'tracking';
  ensureAudio();

  watchId = navigator.geolocation.watchPosition(onPosition, err => {
    if (err.code === 1) { pauseTrackingSilent(); showPermissionError(err); }
  }, { enableHighAccuracy:true, maximumAge:0, timeout:10000 });

  document.getElementById('controlsIdle').style.display = 'none';
  document.getElementById('controlsTracking').style.display = 'flex';
  setStatusBadge('tracking');
  timerInterval = setInterval(() => { renderStats(); checkStillness(); }, 1000);
}

function setStatusBadge(mode){
  const badge = document.getElementById('statusBadge');
  const text = document.getElementById('statusText');
  if (!badge) return;
  if (mode === 'hidden'){ badge.style.display = 'none'; return; }
  badge.style.display = 'flex';
  badge.classList.toggle('tracking', mode === 'tracking');
  badge.classList.toggle('paused', mode === 'paused');
  if (text) text.textContent = mode === 'tracking' ? 'Enregistrement en cours' : 'Pause automatique (immobile)';
}

function enterPause(){
  status = 'paused';
  pausedAt = Date.now();
  setStatusBadge('paused');
}
function exitPause(){
  pausedTotal += Date.now() - pausedAt;
  pausedAt = null;
  status = 'tracking';
  lastMoveAt = Date.now();
  setStatusBadge('tracking');
}
function pauseTrackingSilent(){
  if (status === 'tracking'){ status = 'paused'; pausedAt = Date.now(); }
}

/* Sécurité anti-arrêt accidentel : le bouton d'arrêt (petit, texte discret)
   n'agit qu'après un appui maintenu HOLD_DURATION_MS — un contact bref à
   travers un tissu de poche ne suffit pas à déclencher la fin de session. */
function startHold(e){
  if (e) e.preventDefault();
  if (status !== 'tracking' && status !== 'paused') return;
  holdStartAt = Date.now();
  updateHoldUI(0);
  holdInterval = setInterval(() => {
    const frac = Math.min(1, (Date.now() - holdStartAt) / HOLD_DURATION_MS);
    updateHoldUI(frac);
  }, 50);
  holdTimer = setTimeout(() => {
    cancelHold();
    confirmStopSound();
    finishTracking();
  }, HOLD_DURATION_MS);
}
function cancelHold(){
  if (holdTimer) clearTimeout(holdTimer);
  if (holdInterval) clearInterval(holdInterval);
  holdTimer = null; holdInterval = null;
  updateHoldUI(0);
}
function updateHoldUI(frac){
  const fill = document.getElementById('holdFill');
  const label = document.getElementById('holdLabel');
  if (fill) fill.style.width = (frac * 100) + '%';
  if (label){
    if (frac <= 0){
      label.innerHTML = 'Maintenir 3s<br>pour arrêter';
    } else {
      const remaining = Math.ceil((HOLD_DURATION_MS - frac * HOLD_DURATION_MS) / 1000);
      label.textContent = remaining + ' s…';
    }
  }
}

function computeSplits(pts){
  if (pts.length < 2) return [];
  const splits = [];
  let cumDist = 0;
  let kmTarget = 1000;
  let lastSplitTime = pts[0].t;
  for (let i = 1; i < pts.length; i++){
    const d = haversine(pts[i-1], pts[i]);
    const newCum = cumDist + d;
    if (newCum >= kmTarget && d > 0){
      const frac = (kmTarget - cumDist) / d;
      const tAtKm = pts[i-1].t + frac * (pts[i].t - pts[i-1].t);
      splits.push({ km: kmTarget/1000, sec: (tAtKm - lastSplitTime)/1000 });
      lastSplitTime = tAtKm;
      kmTarget += 1000;
    }
    cumDist = newCum;
  }
  return splits;
}

async function finishTracking(){
  clearInterval(timerInterval);
  if (watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }

  const elapsedSec = ((pausedAt || Date.now()) - startTime - pausedTotal) / 1000;

  if (points.length < 2 || distanceM < 20){
    resetTrackerUI();
    return;
  }

  const activity = {
    id: String(Date.now()),
    date: new Date(startTime).toISOString(),
    type: 'marche',
    distanceM: Math.round(distanceM),
    durationSec: Math.round(elapsedSec),
    elevGainM: Math.round(elevGainM),
    splits: computeSplits(points),
    points: points.map(p => ({ lat: p.lat, lng: p.lng, t: p.t, alt: (typeof p.alt === 'number' ? p.alt : null) }))
  };
  await saveActivityRecord(activity);
  resetTrackerUI();
  renderHistory();
  switchView('history');
}

function resetTrackerUI(){
  status = 'idle';
  points = []; distanceM = 0; pausedTotal = 0;
  elevGainM = 0; lastGoodAlt = null;
  lastRawPoint = null; lastSmoothed = null; lastMoveAt = null;
  lastAnnouncedKm = 0;
  pathLine.setLatLngs([]);
  if (currentMarker){ map.removeLayer(currentMarker); currentMarker = null; }
  document.getElementById('controlsIdle').style.display = 'flex';
  document.getElementById('controlsTracking').style.display = 'none';
  setStatusBadge('hidden');
  renderStats();
}

/* ================= GPX export ================= */
function toGPX(act){
  const trkpts = act.points.map(p => {
    const time = p.t ? new Date(p.t).toISOString() : '';
    const ele = (typeof p.alt === 'number') ? `<ele>${p.alt.toFixed(1)}</ele>` : '';
    return `      <trkpt lat="${p.lat}" lon="${p.lng}">${ele}${time ? `<time>${time}</time>` : ''}</trkpt>`;
  }).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Sentier" xmlns="http://www.topografix.com/GPX/1/1">
  <trk>
    <name>Marche du ${fmtDate(act.date)}</name>
    <type>walking</type>
    <trkseg>
${trkpts}
    </trkseg>
  </trk>
</gpx>`;
}
function downloadGPX(act){
  const gpx = toGPX(act);
  const blob = new Blob([gpx], { type: 'application/gpx+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const day = new Date(act.date).toISOString().slice(0,10);
  a.href = url;
  a.download = `marche-${day}.gpx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* ================= history + weekly stats ================= */
function drawPreview(canvas, pts){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  if (pts.length < 2) return;
  const lats = pts.map(p=>p.lat), lngs = pts.map(p=>p.lng);
  const minLat=Math.min(...lats), maxLat=Math.max(...lats);
  const minLng=Math.min(...lngs), maxLng=Math.max(...lngs);
  const pad = 6;
  const spanLat = (maxLat-minLat) || 0.0005;
  const spanLng = (maxLng-minLng) || 0.0005;
  const scale = Math.min((w-2*pad)/spanLng, (h-2*pad)/spanLat);
  const offX = (w - spanLng*scale)/2, offY = (h - spanLat*scale)/2;
  ctx.beginPath();
  pts.forEach((p,i) => {
    const x = offX + (p.lng-minLng)*scale;
    const y = h - (offY + (p.lat-minLat)*scale);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.strokeStyle = '#7fbf6b';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function isoWeekMonday(date){
  const d = new Date(date);
  const day = (d.getDay() + 6) % 7;
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - day);
  return d;
}
function weekKey(date){ return isoWeekMonday(date).toISOString().slice(0,10); }
function lastNWeekKeys(n){
  const monday = isoWeekMonday(new Date());
  const keys = [];
  for (let i = n - 1; i >= 0; i--){
    const d = new Date(monday);
    d.setDate(monday.getDate() - 7*i);
    keys.push(d.toISOString().slice(0,10));
  }
  return keys;
}
function buildWeeklyStats(activities){
  const map = {};
  activities.forEach(a => {
    const k = weekKey(a.date);
    if (!map[k]) map[k] = { distanceM:0, durationSec:0, count:0 };
    map[k].distanceM += a.distanceM;
    map[k].durationSec += a.durationSec;
    map[k].count += 1;
  });
  return map;
}
function renderStatsPanelHTML(activities){
  const weekMap = buildWeeklyStats(activities);
  const curKey = weekKey(new Date());
  const cur = weekMap[curKey] || { distanceM:0, durationSec:0, count:0 };
  const weekKeys = lastNWeekKeys(6);
  const maxDist = Math.max(1, ...weekKeys.map(k => (weekMap[k] ? weekMap[k].distanceM : 0)));
  const bars = weekKeys.map(k => {
    const wk = weekMap[k] || { distanceM:0 };
    const h = Math.max(3, Math.round((wk.distanceM / maxDist) * 54));
    const label = new Date(k + 'T00:00:00').toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
    const isCur = k === curKey;
    return `<div class="wbar-col">
      <div class="wbar" style="height:${h}px; background:${isCur ? 'var(--accent-2)' : 'var(--accent)'};" title="${(wk.distanceM/1000).toFixed(1)} km"></div>
      <div class="wbar-label">${label}</div>
    </div>`;
  }).join('');
  return `
    <div id="statsPanel">
      <div class="week-summary">
        <div class="ws-item"><div class="ws-val">${(cur.distanceM/1000).toFixed(2)}</div><div class="ws-label">km cette semaine</div></div>
        <div class="ws-item"><div class="ws-val">${fmtTime(cur.durationSec)}</div><div class="ws-label">temps</div></div>
        <div class="ws-item"><div class="ws-val">${cur.count}</div><div class="ws-label">sorties</div></div>
      </div>
      <div class="week-chart">${bars}</div>
    </div>`;
}

async function renderHistory(){
  const list = document.getElementById('historyList');
  const ids = await getIndex();
  if (ids.length === 0){
    list.innerHTML = `<div class="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3v18h18M7 14l4-4 3 3 5-6"/></svg>
      <div>Aucune marche enregistrée</div>
      <div style="font-size:12px;">Lance un suivi depuis l'onglet Suivi</div>
    </div>`;
    return;
  }
  const activities = (await Promise.all(ids.map(getActivity))).filter(Boolean);
  list.innerHTML = renderStatsPanelHTML(activities);
  activities.forEach(act => {
    const card = document.createElement('div');
    card.className = 'activity-card';
    const km = (act.distanceM/1000).toFixed(2);
    const speed = fmtSpeed(act.durationSec, act.distanceM/1000);
    card.innerHTML = `
      <canvas width="64" height="64"></canvas>
      <div class="activity-info">
        <div class="activity-date">${fmtDate(act.date)}</div>
        <div class="activity-stats">
          <div><span class="n">${km}</span><span class="u">km</span></div>
          <div><span class="n">${fmtTime(act.durationSec)}</span><span class="u">durée</span></div>
          <div><span class="n">${speed}</span><span class="u">vitesse</span></div>
        </div>
      </div>
      <button class="activity-del" title="Exporter en GPX" style="color:var(--text-muted);">⇩</button>
      <button class="activity-del" title="Supprimer">✕</button>
    `;
    const canvas = card.querySelector('canvas');
    requestAnimationFrame(() => drawPreview(canvas, act.points));
    const [exportBtn, delBtn] = card.querySelectorAll('.activity-del');
    exportBtn.onclick = (e) => { e.stopPropagation(); downloadGPX(act); };
    delBtn.onclick = async (e) => {
      e.stopPropagation();
      if (confirm('Supprimer cette marche ?')){
        await deleteActivityRecord(act.id);
        renderHistory();
      }
    };
    card.onclick = () => openDetail(act);
    list.appendChild(card);
  });
}

/* ================= replay (Leaflet + bascule CSS 3D + profil altimétrique) =================
   Ancienne version : MapLibre GL + relief Terrarium (WebGL, rendu terrain réel).
   Abandonnée : rendu illisible sur le terminal testé (WebGL2/terrain mal supporté
   sur certains GPU mobiles — seul le point mobile apparaissait, sans fond de carte).
   Nouvelle version : réutilise Leaflet (déjà éprouvé dans l'app) avec un effet de
   bascule purement visuel en CSS (perspective + rotateX), sans dépendance WebGL,
   et un vrai profil altimétrique dessiné en canvas 2D — universellement lisible. */
let replayProfile = null;

function buildElevationProfile(act){
  const pts = act.points;
  if (!pts.length || !pts.some(p => typeof p.alt === 'number')){
    return { distances: [], alts: [], hasData: false };
  }
  const distances = [0];
  const alts = [ typeof pts[0].alt === 'number' ? pts[0].alt : null ];
  let cum = 0;
  for (let i = 1; i < pts.length; i++){
    cum += haversine(pts[i-1], pts[i]);
    distances.push(cum);
    alts.push(typeof pts[i].alt === 'number' ? pts[i].alt : null);
  }
  let last = alts.find(a => a !== null);
  if (last === undefined) return { distances: [], alts: [], hasData: false };
  for (let i = 0; i < alts.length; i++){
    if (alts[i] === null) alts[i] = last; else last = alts[i];
  }
  return { distances, alts, hasData: true };
}

function drawElevationChart(canvas, profile, frac){
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width = canvas.clientWidth * dpr;
  const h = canvas.height = canvas.clientHeight * dpr;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  if (!profile.hasData || profile.alts.length < 2 || w === 0 || h === 0) return;

  const minA = Math.min(...profile.alts), maxA = Math.max(...profile.alts);
  const spanA = Math.max(1, maxA - minA);
  const maxD = profile.distances[profile.distances.length - 1] || 1;
  const pad = 5 * dpr;
  const toXY = (d, a) => [
    pad + (d / maxD) * (w - 2*pad),
    h - pad - ((a - minA) / spanA) * (h - 2*pad)
  ];

  ctx.beginPath();
  profile.distances.forEach((d, i) => {
    const [x, y] = toXY(d, profile.alts[i]);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#7fbf6b';
  ctx.lineWidth = 2 * dpr;
  ctx.stroke();

  const [lastX] = toXY(maxD, profile.alts[profile.alts.length - 1]);
  ctx.lineTo(lastX, h - pad);
  ctx.lineTo(pad, h - pad);
  ctx.closePath();
  ctx.fillStyle = 'rgba(127,191,107,0.15)';
  ctx.fill();

  if (frac >= 0){
    const d = maxD * frac;
    let a = profile.alts[profile.alts.length - 1];
    for (let i = 1; i < profile.distances.length; i++){
      if (profile.distances[i] >= d){
        const span = Math.max(1e-6, profile.distances[i] - profile.distances[i-1]);
        const t = (d - profile.distances[i-1]) / span;
        a = profile.alts[i-1] + t * (profile.alts[i] - profile.alts[i-1]);
        break;
      }
    }
    const [mx, my] = toXY(d, a);
    ctx.beginPath();
    ctx.arc(mx, my, 4 * dpr, 0, Math.PI * 2);
    ctx.fillStyle = '#e8a33d';
    ctx.fill();
  }
}

function openReplay(act){
  document.getElementById('replayOverlay').classList.add('active');
  if (replayMap){ replayMap.remove(); replayMap = null; }
  document.getElementById('replayMap').innerHTML = '';

  replayCoords = act.points.map(p => [p.lat, p.lng]);
  replayIdx = 0;
  replayPlaying = false;
  document.getElementById('replayPlayBtn').textContent = '▶';
  replayProfile = buildElevationProfile(act);
  updateReplayReadout(act, 0);

  const elevCanvas = document.getElementById('elevCanvas');
  const elevWrap = document.getElementById('elevProfile');
  if (replayProfile.hasData){
    elevWrap.innerHTML = '<canvas id="elevCanvas"></canvas>';
    drawElevationChart(document.getElementById('elevCanvas'), replayProfile, 0);
  } else {
    elevWrap.innerHTML = '<div class="elev-empty">Profil altimétrique indisponible pour cette marche (enregistrée avant l\'ajout de l\'altitude)</div>';
  }

  setTimeout(() => {
    replayMap = L.map('replayMap', {
      zoomControl:false, attributionControl:false, dragging:false,
      scrollWheelZoom:false, doubleClickZoom:false, touchZoom:false,
      boxZoom:false, keyboard:false, tap:false
    });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19 }).addTo(replayMap);
    const line = L.polyline(replayCoords, { color:'#7fbf6b', weight:4 }).addTo(replayMap);
    replayMap.fitBounds(line.getBounds(), { padding:[20,20] });
    replayMap._runnerMarker = L.circleMarker(replayCoords[0], {
      radius:8, color:'#101a16', weight:2, fillColor:'#e8a33d', fillOpacity:1
    }).addTo(replayMap);
    replayMap.invalidateSize();
  }, 60);

  document.getElementById('replayPlayBtn').onclick = () => toggleReplay(act);
  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      replaySpeed = parseInt(btn.dataset.speed, 10);
    };
  });
}

function toggleReplay(act){
  replayPlaying = !replayPlaying;
  document.getElementById('replayPlayBtn').textContent = replayPlaying ? '⏸' : '▶';
  if (replayPlaying) replayStep(act);
}
function replayStep(act){
  if (!replayPlaying) return;
  if (replayIdx >= replayCoords.length - 1){
    replayPlaying = false;
    document.getElementById('replayPlayBtn').textContent = '▶';
    return;
  }
  replayIdx = Math.min(replayIdx + replaySpeed, replayCoords.length - 1);
  const c = replayCoords[replayIdx];
  if (replayMap){
    replayMap.panTo(c, { animate:true, duration:0.22, easeLinearity:1 });
    if (replayMap._runnerMarker) replayMap._runnerMarker.setLatLng(c);
  }
  const frac = replayIdx / (replayCoords.length - 1);
  const canvas = document.getElementById('elevCanvas');
  if (canvas) drawElevationChart(canvas, replayProfile, frac);
  updateReplayReadout(act, replayIdx);
  replayTimer = setTimeout(() => replayStep(act), 220);
}
function updateReplayReadout(act, idx){
  const frac = replayCoords.length > 1 ? idx / (replayCoords.length - 1) : 0;
  const distSoFar = (act.distanceM/1000) * frac;
  const timeSoFar = act.durationSec * frac;
  const el = document.getElementById('replayReadout');
  if (el) el.textContent = `${distSoFar.toFixed(2)} km · ${fmtTime(timeSoFar)}`;
}
function closeReplay(){
  replayPlaying = false;
  if (replayTimer) clearTimeout(replayTimer);
  if (replayMap){ replayMap.remove(); replayMap = null; }
  document.getElementById('replayOverlay').classList.remove('active');
}

/* ================= view switching ================= */
function switchView(name){
  document.getElementById('view-tracker').classList.toggle('active', name === 'tracker');
  document.getElementById('view-history').classList.toggle('active', name === 'history');
  document.getElementById('navTracker').classList.toggle('active', name === 'tracker');
  document.getElementById('navHistory').classList.toggle('active', name === 'history');
  document.getElementById('headerSub').textContent = name === 'tracker' ? 'marche à pied' : 'parcours enregistrés';
  if (name === 'tracker') setTimeout(() => map.invalidateSize(), 50);
  if (name === 'history') renderHistory();
}

/* ================= boot ================= */
initMap();
loadSettings();
if (!navigator.geolocation){
  showPermissionError({ code: 2 });
} else {
  navigator.permissions?.query?.({ name:'geolocation' }).then(res => {
    if (res.state === 'denied') showPermissionError({ code:1 });
  }).catch(()=>{});
}
const finishBtn = document.getElementById('finishBtn');
if (finishBtn){
  finishBtn.addEventListener('pointerdown', startHold);
  finishBtn.addEventListener('pointerup', cancelHold);
  finishBtn.addEventListener('pointerleave', cancelHold);
  finishBtn.addEventListener('pointercancel', cancelHold);
  finishBtn.addEventListener('contextmenu', e => e.preventDefault());
}
renderStats();
